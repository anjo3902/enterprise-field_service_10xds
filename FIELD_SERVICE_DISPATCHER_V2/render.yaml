services:
  # ── Backend (FastAPI) ──────────────────────────────────────
  - type: web
    name: field-service-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false                       # set manually in Render dashboard
      - key: GCP_PROJECT_ID
        value: tenxgs-interns-work
      - key: GCP_LOCATION
        value: us-central1
      - key: FIRESTORE_DATABASE_ID
        value: field-service-dispatcher
      - key: field-service-dispatcher
        value: anjo-storage
      - key: GCS_UPLOAD_PREFIX
        value: service_requests
      - key: GCS_SIGNED_URL_TTL_SECONDS
        value: "600"
      - key: MAX_EVIDENCE_IMAGE_BYTES
        value: "2097152"

  # ── Frontend (React + Vite static site) ────────────────────
  - type: web
    name: field-service-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false                       # set to backend URL after first deploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
